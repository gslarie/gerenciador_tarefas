{% extends 'tarefas/base.html' %}

{% block title %}Cadastrar Usuário{% endblock %}

{% block content %}

<div class="container">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">

        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">Cadastrar Usuário</h4>
        </div>

        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Nome</label>
                    {{ form.nome }}
                    {{ form.nome.errors }}
                </div>

                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    {{ form.email }}
                    {{ form.email.errors }}
                </div>

                <button type="submit" class="btn btn-success">
                    Cadastrar
                </button>

                <a href="{% url 'kanban' %}" class="btn btn-secondary">
                    Voltar
                </a>

            </form>

        </div>
    </div>
</div>

{% endblock %}
