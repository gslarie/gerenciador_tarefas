<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Gerenciador de Tarefas{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand" href="{% url 'kanban' %}">
            Gerenciador de Tarefas
        </a>

        <div>
            <a href="{% url 'kanban' %}" class="btn btn-outline-light btn-sm">
                Início
            </a>

            <a href="{% url 'cadastrar_usuario' %}" class="btn btn-outline-light btn-sm">
                Usuários
            </a>

            <a href="{% url 'cadastrar_tarefa' %}" class="btn btn-success btn-sm">
                Nova tarefa
            </a>
        </div>
    </nav>

    <main class="container-fluid py-4">

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
